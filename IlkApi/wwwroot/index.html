<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Skor Tablosu</title>
</head>
<body>
    <h1>Skor Tablosu</h1>
    <input id="oyuncu" placeholder="Oyuncu Adı" />
    <input id="puan" type="number" placeholder="Puan" />
    <button onclick="skorEkle()">Kaydet</button>
    <p id="hata" style="color:red"></p>
    <ul id="liste"></ul>

    <script>
                let tumSkorlar = [];

                async function skorlariGetir() {
                    const cevap = await fetch("/skorlar", { cache: "no-store" });
                    tumSkorlar = await cevap.json();

                    const liste = document.getElementById("liste");
                    liste.innerHTML = "";

                for (const s of tumSkorlar) {
                    const li = document.createElement("li");
                    li.id = `satir-${s.id}`;

                    const yazi = document.createElement("span");
                    yazi.textContent = `${s.oyuncu}:${s.puan} `;

                    const guncelleBtn = document.createElement("button");
                    guncelleBtn.textContent = "Güncelle";
                    guncelleBtn.onclick = () => guncelleAc(s.id);

                    const silBtn = document.createElement("button");
                    silBtn.textContent = "Sil";
                    silBtn.onclick = () => skorSil(s.id);

                    li.append(yazi, guncelleBtn, " ", silBtn);
                    liste.appendChild(li);
    }
}

                function kutulariTemizle() {
                    document.getElementById("oyuncu").value = "";
                    document.getElementById("puan").value = "";
                }

                function hataGoster(mesaj) { 
                    document.getElementById("hata").textContent = mesaj;
                }

                async function skorEkle() {
                    const oyuncu = document.getElementById("oyuncu").value;
                    const puan = Number(document.getElementById("puan").value);

                    const cevap = await fetch("/skorlar", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ id: 0, oyuncu: oyuncu, puan: puan })
                    });

                    if (!cevap.ok) { 
                        hataGoster(cevap.status === 400 ? await cevap.json() : "Bir hata oluştu.");
                        return;
                    }

                    hataGoster("");
                    await skorlariGetir();
                    kutulariTemizle();
                }

                async function skorSil(id) {
                    await fetch(`/skorlar/${id}`, { method: "DELETE" });
                    await skorlariGetir();
                    kutulariTemizle();
                }

                function guncelleAc(id) {
                    const skor = tumSkorlar.find(s => s.id === id);
                    const satir = document.getElementById(`satir-${id}`);

                    satir.innerHTML = `<input id="yeniOyuncu-${id}" /> <input id="yeniPuan-${id}" type="number" /> <button onclick="guncelleOnayla(${id})">Onayla</button> <button onclick="skorlariGetir()">İptal</button>`;

                    document.getElementById(`yeniOyuncu-${id}`).value = skor.oyuncu;
                    document.getElementById(`yeniPuan-${id}`).value = skor.puan;
                }

                async function guncelleOnayla(id) {
                    const oyuncu = document.getElementById(`yeniOyuncu-${id}`).value;
                    const puan = Number(document.getElementById(`yeniPuan-${id}`).value);

                    const cevap = await fetch(`/skorlar/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ id: id, oyuncu: oyuncu, puan: puan })
                    });

                    if (!cevap.ok) {
                        hataGoster(cevap.status === 400 ? await cevap.json() : "Bir hata oluştu.");
                        return;
                    }

                    hataGoster("");
                    await skorlariGetir();
                }

                skorlariGetir();
    </script>
</body>
</html>
