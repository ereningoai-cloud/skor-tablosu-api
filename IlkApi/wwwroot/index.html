<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Skor Tablosu</title>
</head>
<body>
    <h1>Skor Tablosu</h1>

    <div id="girisAlani">
        <input id="kullaniciAdi" placeholder="Kullanıcı adı" />
        <input id="sifre" type="password" placeholder="Şifre" />
        <button onclick="girisYap()">Giriş</button>
        <button onclick="kayitOl()">Kayıt ol</button>
    </div>

    <div id="kullaniciAlani" style="display:none">
        <span id="kullaniciYazi"></span>
        <button onclick="cikisYap()">Çıkış</button>
    </div>

    <div id="skorFormu" style="display:none">
        <input id="oyuncu" placeholder="Oyuncu Adı" />
        <input id="puan" type="number" placeholder="Puan" />
        <button onclick="skorEkle()">Kaydet</button>
    </div>

    <p id="hata" style="color:red"></p>
    <ul id="liste"></ul>

    <script>
                let tumSkorlar = [];
                let token = sessionStorage.getItem("token");
                let benimId = null;

                function yetkiBasligi() {
                    return { "Content-Type": "application/json", "Authorization": `Bearer ${token}` };
                }

                function hataGoster(mesaj) {
                    document.getElementById("hata").textContent = mesaj;
                }

                async function hataYonet(cevap) {
                    if (cevap.status === 401) {
                        cikisYap();
                        hataGoster("Oturum geçersiz ya da süresi doldu, tekrar giriş yap.");
                    } else if (cevap.status === 403) {
                        hataGoster("Bu skor sana ait değil.");
                    } else if (cevap.status === 400 || cevap.status === 409) {
                        hataGoster(await cevap.json());
                    } else {
                        hataGoster("Bir hata oluştu.");
                    }
                }

                function arayuzuGuncelle(kullaniciAdi) {
                    const girisYapildi = benimId !== null;
                    document.getElementById("girisAlani").style.display = girisYapildi ? "none" : "block";
                    document.getElementById("kullaniciAlani").style.display = girisYapildi ? "block" : "none";
                    document.getElementById("skorFormu").style.display = girisYapildi ? "block" : "none";
                    document.getElementById("kullaniciYazi").textContent = girisYapildi ? `Giriş yapan: ${kullaniciAdi} ` : "";
                }

                async function oturumuKontrolEt() {
                    benimId = null;
                    let ad = "";
                    if (token) {
                        const cevap = await fetch("/ben", { headers: yetkiBasligi() });
                        if (cevap.ok) {
                            const ben = await cevap.json();
                            benimId = Number(ben.id);
                            ad = ben.ad;
                        } else {
                            token = null;
                            sessionStorage.removeItem("token");
                        }
                    }
                    arayuzuGuncelle(ad);
                }

                async function girisYap() {
                    const kullaniciAdi = document.getElementById("kullaniciAdi").value;
                    const sifre = document.getElementById("sifre").value;

                    const cevap = await fetch("/giris", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ kullaniciAdi: kullaniciAdi, sifre: sifre })
                    });

                    if (!cevap.ok) {
                        hataGoster("Kullanıcı adı ya da şifre hatalı.");
                        return;
                    }

                    token = (await cevap.json()).token;
                    sessionStorage.setItem("token", token);
                    document.getElementById("sifre").value = "";
                    hataGoster("");
                    await oturumuKontrolEt();
                    await skorlariGetir();
                }

                async function kayitOl() {
                    const kullaniciAdi = document.getElementById("kullaniciAdi").value;
                    const sifre = document.getElementById("sifre").value;

                    const cevap = await fetch("/kayit", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ kullaniciAdi: kullaniciAdi, sifre: sifre })
                    });

                    if (!cevap.ok) {
                        await hataYonet(cevap);
                        return;
                    }

                    await girisYap();
                }

                function cikisYap() {
                    token = null;
                    benimId = null;
                    sessionStorage.removeItem("token");
                    arayuzuGuncelle("");
                    skorlariGetir();
                }

                async function skorlariGetir() {
                    const cevap = await fetch("/skorlar", { cache: "no-store" });
                    tumSkorlar = await cevap.json();

                    const liste = document.getElementById("liste");
                    liste.innerHTML = "";

                    for (const s of tumSkorlar) {
                        const li = document.createElement("li");
                        li.id = `satir-${s.id}`;

                        const yazi = document.createElement("span");
                        yazi.textContent = `${s.oyuncu}:${s.puan} `;
                        li.append(yazi);

                        if (benimId !== null && s.kullaniciId === benimId) {
                            const guncelleBtn = document.createElement("button");
                            guncelleBtn.textContent = "Güncelle";
                            guncelleBtn.onclick = () => guncelleAc(s.id);

                            const silBtn = document.createElement("button");
                            silBtn.textContent = "Sil";
                            silBtn.onclick = () => skorSil(s.id);

                            li.append(guncelleBtn, " ", silBtn);
                        }

                        liste.appendChild(li);
                    }
                }

                function kutulariTemizle() {
                    document.getElementById("oyuncu").value = "";
                    document.getElementById("puan").value = "";
                }

                async function skorEkle() {
                    const oyuncu = document.getElementById("oyuncu").value;
                    const puan = Number(document.getElementById("puan").value);

                    const cevap = await fetch("/skorlar", {
                        method: "POST",
                        headers: yetkiBasligi(),
                        body: JSON.stringify({ id: 0, oyuncu: oyuncu, puan: puan })
                    });

                    if (!cevap.ok) {
                        await hataYonet(cevap);
                        return;
                    }

                    hataGoster("");
                    await skorlariGetir();
                    kutulariTemizle();
                }

                async function skorSil(id) {
                    const cevap = await fetch(`/skorlar/${id}`, { method: "DELETE", headers: yetkiBasligi() });

                    if (!cevap.ok) {
                        await hataYonet(cevap);
                        return;
                    }

                    hataGoster("");
                    await skorlariGetir();
                }

                function guncelleAc(id) {
                    const skor = tumSkorlar.find(s => s.id === id);
                    const satir = document.getElementById(`satir-${id}`);

                    satir.innerHTML = `<input id="yeniOyuncu-${id}" /> <input id="yeniPuan-${id}" type="number" /> <button onclick="guncelleOnayla(${id})">Onayla</button> <button onclick="skorlariGetir()">İptal</button>`;

                    document.getElementById(`yeniOyuncu-${id}`).value = skor.oyuncu;
                    document.getElementById(`yeniPuan-${id}`).value = skor.puan;
                }

                async function guncelleOnayla(id) {
                    const oyuncu = document.getElementById(`yeniOyuncu-${id}`).value;
                    const puan = Number(document.getElementById(`yeniPuan-${id}`).value);

                    const cevap = await fetch(`/skorlar/${id}`, {
                        method: "PUT",
                        headers: yetkiBasligi(),
                        body: JSON.stringify({ id: id, oyuncu: oyuncu, puan: puan })
                    });

                    if (!cevap.ok) {
                        await hataYonet(cevap);
                        return;
                    }

                    hataGoster("");
                    await skorlariGetir();
                }

                (async () => {
                    await oturumuKontrolEt();
                    await skorlariGetir();
                })();
    </script>
</body>
</html>
