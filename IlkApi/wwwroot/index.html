<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Skor Tablosu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="kart">
        <h1>Skor Tablosu</h1>

        <div id="girisAlani">
            <input id="kullaniciAdi" placeholder="Kullanıcı adı" />
            <input id="sifre" type="password" placeholder="Şifre" />
            <button onclick="girisYap()">Giriş</button>
            <button onclick="kayitOl()">Kayıt ol</button>
        </div>

        <div id="kullaniciAlani" style="display:none">
            <span id="kullaniciYazi"></span>
            <button onclick="cikisYap()">Çıkış</button>
        </div>

        <p id="hata"></p>

        <div id="tabloAlani" style="display:none">
            <label for="siralama">Sıralama:</label>
            <select id="siralama" onchange="tabloyuCiz()">
                <option value="yeni">En yeni</option>
                <option value="yuksek" selected>Yüksekten düşüğe</option>
                <option value="dusuk">Düşükten yükseğe</option>
            </select>
            <button onclick="skorlariGetir()">Yenile</button>
            <div id="tablo"></div>
        </div>
    </main>
    <script>
                                        let tumSkorlar = [];
                                        let token = sessionStorage.getItem("token");
                                        let benimId = null;

                                        function hataGoster(mesaj) {
                                            document.getElementById("hata").textContent = mesaj;
                                        }

                                        function arayuzuGuncelle(kullaniciAdi) {
                                            const girisYapildi = benimId !== null;
                                            document.getElementById("girisAlani").style.display = girisYapildi ? "none" : "block";
                                            document.getElementById("kullaniciAlani").style.display = girisYapildi ? "block" : "none";
                                            document.getElementById("tabloAlani").style.display = girisYapildi ? "block" : "none";
                                            document.getElementById("kullaniciYazi").textContent = girisYapildi ? `Giriş yapan: ${kullaniciAdi} ` : "";
                                        }

                                        async function oturumuKontrolEt() {
                                            benimId = null;
                                            let ad = "";
                                            if (token) {
                                                const cevap = await fetch("/ben", { headers: { "Authorization": `Bearer ${token}` } });
                                                if (cevap.ok) {
                                                    const ben = await cevap.json();
                                                    benimId = Number(ben.id);
                                                    ad = ben.ad;
                                                } else {
                                                    token = null;
                                                    sessionStorage.removeItem("token");
                                                }
                                            }
                                            arayuzuGuncelle(ad);
                                        }

                                        async function girisYap() {
                                            const kullaniciAdi = document.getElementById("kullaniciAdi").value;
                                            const sifre = document.getElementById("sifre").value;

                                            if (!kullaniciAdi.trim() || !sifre) {
                                                hataGoster("Oyuncu adı ve şifre boş olamaz.");
                                                return;
                                            }

                                            const cevap = await fetch("/giris", {
                                                method: "POST",
                                                headers: { "Content-Type": "application/json" },
                                                body: JSON.stringify({ kullaniciAdi: kullaniciAdi, sifre: sifre })
                                            });

                                            if (!cevap.ok) {
                                                if (cevap.status === 404) hataGoster("Böyle bir oyuncu bulunamadı.");
                                                else if (cevap.status === 401) hataGoster("Şifre hatalı.");
                                                else hataGoster("Bir hata oluştu.");
                                                return;
                                            }

                                            token = (await cevap.json()).token;
                                            sessionStorage.setItem("token", token);
                                            document.getElementById("sifre").value = "";
                                            hataGoster("");
                                            await oturumuKontrolEt();
                                            await skorlariGetir();
                                        }

                                        async function kayitOl() {
                                            const kullaniciAdi = document.getElementById("kullaniciAdi").value;
                                            const sifre = document.getElementById("sifre").value;

                                            const cevap = await fetch("/kayit", {
                                                method: "POST",
                                                headers: { "Content-Type": "application/json" },
                                                body: JSON.stringify({ kullaniciAdi: kullaniciAdi, sifre: sifre })
                                            });

                                            if (!cevap.ok) {
                                                if (cevap.status === 409) hataGoster("Bu oyuncu adı kullanılmaktadır.");
                                                else if (cevap.status === 400) hataGoster(await cevap.json());
                                                else hataGoster("Bir hata oluştu.");
                                                return;
                                            }

                                            await girisYap();
                                        }

                                        function cikisYap() {
                                            token = null;
                                            benimId = null;
                                            sessionStorage.removeItem("token");
                                            arayuzuGuncelle("");
                                        }

                                        function zaman(s) {
                                            return s.tarih ? new Date(tarihDuzelt(s.tarih)).getTime() : 0;
                                        }

                                        function tarihDuzelt(t) {
                                            return /Z|[+-]\d{2}:\d{2}$/.test(t) ? t : t + "Z";
                                        }

                                        async function skorlariGetir() {
                                            const cevap = await fetch("/skorlar", { cache: "no-store" });
                                            tumSkorlar = await cevap.json();
                                            tabloyuCiz();
                                        }

                                        function tabloyuCiz() {
                                            const siralama = document.getElementById("siralama").value;
                                            const liste = [...tumSkorlar];

                                            if (siralama === "yeni") liste.sort((a, b) => zaman(b) - zaman(a));
                                            else if (siralama === "yuksek") liste.sort((a, b) => b.puan - a.puan || zaman(b) - zaman(a));
                                            else liste.sort((a, b) => a.puan - b.puan || zaman(b) - zaman(a));

                                            const kap = document.getElementById("tablo");
                                            kap.innerHTML = "";

                                            if (liste.length === 0) {
                                                kap.textContent = "Henüz skor yok. Oyundan ilk skoru sen yap!";
                                                return;
                                            }

                                            const tablo = document.createElement("table");

                                            const baslik = tablo.insertRow();
                                            for (const ad of ["#", "Oyuncu", "Puan", "Tarih"]) {
                                                const th = document.createElement("th");
                                                th.textContent = ad;
                                                baslik.appendChild(th);
                                            }

                                            liste.forEach((s, i) => {
                                                const satir = tablo.insertRow();
                                                if (s.kullaniciId === benimId) satir.className = "ben";

                                                satir.insertCell().textContent = i + 1;
                                                satir.insertCell().textContent = s.kullaniciId === benimId ? `${s.oyuncu} (sen)` : s.oyuncu;
                                                satir.insertCell().textContent = s.puan;
                                                satir.insertCell().textContent = s.tarih ? new Date(tarihDuzelt(s.tarih)).toLocaleString("tr-TR") : "-";
                                            });

                                            kap.appendChild(tablo);
                                        }

                                        (async () => {
                                            await oturumuKontrolEt();
                                            if (benimId !== null) await skorlariGetir();
                                        })();
    </script>
</body>
</html>
